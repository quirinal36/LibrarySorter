name: Deploy static web pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test browser logic
        run: node --test tests/game.test.js LibraryDetector/tests/*.test.mjs
      - name: Assemble public web assets only
        run: |
          mkdir -p _site/LibraryDetector/src
          cp index.html app.js style.css books.json _site/
          cp LibraryDetector/index.html LibraryDetector/style.css _site/LibraryDetector/
          cp LibraryDetector/src/*.mjs _site/LibraryDetector/src/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
